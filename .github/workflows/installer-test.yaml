name: Test desktop installers

permissions: {}

on:
  workflow_call:
    inputs:
      artifact_prefix:
        required: true
        type: string

jobs:
  linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            package: deb
          - runner: ubuntu-24.04
            arch: amd64
            package: rpm
          - runner: ubuntu-24.04-arm
            arch: arm64
            package: deb
          - runner: ubuntu-24.04-arm
            arch: arm64
            package: rpm
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_prefix }}-linux-${{ matrix.arch }}
          path: artifact
      - name: Install, upgrade and uninstall
        shell: bash
        run: |
          set -euo pipefail
          package="$(find artifact -type f -name '*.${{ matrix.package }}' ! -name 'upgrade-baseline-*' -print -quit)"
          baseline="$(find artifact -type f -name 'upgrade-baseline-*.${{ matrix.package }}' -print -quit)"
          [[ -n "$package" && -n "$baseline" ]]
          require_active_service() {
            for attempt in {1..30}; do
              if sudo systemctl is-active --quiet octelium-desktop-daemon.service; then
                return 0
              fi
              sleep 1
            done
            sudo systemctl status --no-pager --full octelium-desktop-daemon.service || true
            sudo journalctl --no-pager -n 100 -u octelium-desktop-daemon.service || true
            return 1
          }
          package="$(realpath "$package")"
          baseline="$(realpath "$baseline")"
          if [[ "${{ matrix.package }}" == "deb" ]]; then
            sudo apt-get update
            sudo apt-get install -y "$baseline"
            package_name="$(dpkg-deb -f "$package" Package)"
          else
            sudo apt-get update
            sudo apt-get install -y rpm
            sudo rpm -i --nodeps "$baseline"
            package_name="$(rpm -qp --queryformat '%{NAME}' "$package")"
          fi
          sudo systemctl is-enabled --quiet octelium-desktop-daemon.service
          require_active_service
          test -x /usr/bin/octelium-desktop-daemon
          test -f /usr/lib/systemd/system/octelium-desktop-daemon.service
          if [[ "${{ matrix.package }}" == "deb" ]]; then
            sudo dpkg -i "$package"
          else
            sudo rpm -U --nodeps "$package"
          fi
          require_active_service
          if [[ "${{ matrix.package }}" == "deb" ]]; then
            sudo dpkg -P "$package_name"
          else
            sudo rpm -e "$package_name"
          fi
          ! sudo systemctl is-active --quiet octelium-desktop-daemon.service
          test ! -e /usr/bin/octelium-desktop-daemon
          test ! -e /usr/lib/systemd/system/octelium-desktop-daemon.service

  macos:
    name: macOS ${{ matrix.arch }} PKG
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_prefix }}-darwin-${{ matrix.arch }}
          path: artifact
      - name: Install, upgrade and uninstall
        shell: bash
        run: |
          set -euo pipefail
          package="$(find artifact -type f -name '*.pkg' ! -name 'upgrade-baseline-*' -print -quit)"
          baseline="$(find artifact -type f -name 'upgrade-baseline-*.pkg' -print -quit)"
          [[ -n "$package" && -n "$baseline" ]]
          sudo installer -pkg "$baseline" -target /
          sudo launchctl print system/com.octelium.desktop.daemon >/dev/null
          test -x "/Applications/Octelium Desktop.app/Contents/MacOS/octelium-desktop-daemon"
          test -x "/Library/Application Support/Octelium Desktop/uninstall.sh"
          sudo installer -pkg "$package" -target /
          sudo launchctl print system/com.octelium.desktop.daemon >/dev/null
          sudo "/Library/Application Support/Octelium Desktop/uninstall.sh"
          ! sudo launchctl print system/com.octelium.desktop.daemon >/dev/null 2>&1
          test ! -e "/Applications/Octelium Desktop.app"
          test ! -e "/Library/LaunchDaemons/com.octelium.desktop.daemon.plist"
          test ! -e "/Library/Application Support/Octelium Desktop"
          ! pkgutil --pkg-info com.octelium.desktop >/dev/null 2>&1

  windows:
    name: Windows ${{ matrix.arch }} ${{ matrix.installer }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
            installer: msi
          - runner: windows-latest
            arch: amd64
            installer: nsis
          - runner: windows-11-arm
            arch: arm64
            installer: msi
          - runner: windows-11-arm
            arch: arm64
            installer: nsis
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_prefix }}-windows-${{ matrix.arch }}
          path: artifact
      - name: Install, upgrade and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerErrorPath = Join-Path ([Environment]::GetFolderPath("CommonApplicationData")) "Octelium Desktop\installer-error.log"
          Remove-Item -LiteralPath $installerErrorPath -Force -ErrorAction SilentlyContinue

          function Invoke-Checked {
              param(
                  [string]$FilePath,
                  [string[]]$ArgumentList,
                  [string]$LogPath,
                  [string]$Phase
              )

              $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                  if ($LogPath -and (Test-Path -LiteralPath $LogPath)) {
                      Select-String -Path $LogPath -Pattern "Return value 3", "OcteliumDesktopDaemon", "install-daemon", "error" -Context 8, 20 | ForEach-Object { $_.ToString() } | Write-Host
                      Get-Content -LiteralPath $LogPath -Tail 250 | Write-Host
                  }
                  $installerError = $installerErrorPath
                  if (Test-Path -LiteralPath $installerError) {
                      Get-Content -LiteralPath $installerError | Write-Host
                  }
                  throw "$FilePath exited with code $($process.ExitCode) during $Phase"
              }
          }

          function Get-DaemonExecutable {
              param([string]$Phase)
              $service = $null
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                  $service = Get-CimInstance Win32_Service -Filter "Name='OcteliumDaemon'" -ErrorAction SilentlyContinue
                  if ($null -ne $service -and $service.State -eq "Running" -and $service.StartMode -eq "Auto") {
                      break
                  }
                  Start-Sleep -Seconds 1
              }
              if ($null -eq $service -or $service.State -ne "Running" -or $service.StartMode -ne "Auto") {
                  $service | Format-List Name, State, StartMode, ExitCode, PathName | Out-String | Write-Host
                  & sc.exe qc OcteliumDaemon
                  & sc.exe queryex OcteliumDaemon
                  Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager"; StartTime = (Get-Date).AddMinutes(-10) } -MaxEvents 200 -ErrorAction SilentlyContinue | Where-Object Message -Match "Octelium" | Format-List | Out-String | Write-Host
                  throw "The Octelium Desktop daemon service is not running automatically after $Phase"
              }

              $match = [regex]::Match($service.PathName, '^"([^"]+)"|^(\S+)')
              $path = if ($match.Groups[1].Success) { $match.Groups[1].Value } else { $match.Groups[2].Value }
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "The Octelium Desktop daemon executable is missing"
              }
              return $path
          }

          if ("${{ matrix.installer }}" -eq "msi") {
              $installer = Get-ChildItem artifact -Recurse -Filter *.msi | Where-Object Name -NotLike "upgrade-baseline-*" | Select-Object -First 1
              $baseline = Get-ChildItem artifact -Recurse -Filter upgrade-baseline-*.msi | Select-Object -First 1
              if ($null -eq $installer -or $null -eq $baseline) { throw "MSI installers not found" }
              $baselineLog = Join-Path $env:RUNNER_TEMP "octelium-msi-baseline.log"
              Invoke-Checked -FilePath msiexec.exe -ArgumentList @("/i", "`"$($baseline.FullName)`"", "/qn", "/norestart", "/l*v", "`"$baselineLog`"") -LogPath $baselineLog -Phase "baseline MSI install"
              $daemonPath = Get-DaemonExecutable -Phase "baseline MSI install"
              $upgradeLog = Join-Path $env:RUNNER_TEMP "octelium-msi-upgrade.log"
              $arguments = @("/i", "`"$($installer.FullName)`"", "/qn", "/norestart", "/l*v", "`"$upgradeLog`"")
              Invoke-Checked -FilePath msiexec.exe -ArgumentList $arguments -LogPath $upgradeLog -Phase "MSI upgrade"
              $daemonPath = Get-DaemonExecutable -Phase "MSI upgrade"
              $uninstallLog = Join-Path $env:RUNNER_TEMP "octelium-msi-uninstall.log"
              Invoke-Checked -FilePath msiexec.exe -ArgumentList @("/x", "`"$($installer.FullName)`"", "/qn", "/norestart", "/l*v", "`"$uninstallLog`"") -LogPath $uninstallLog -Phase "MSI uninstall"
          } else {
              $installer = Get-ChildItem artifact -Recurse -Filter *-setup.exe | Where-Object Name -NotLike "upgrade-baseline-*" | Select-Object -First 1
              $baseline = Get-ChildItem artifact -Recurse -Filter upgrade-baseline-*-setup.exe | Select-Object -First 1
              if ($null -eq $installer -or $null -eq $baseline) { throw "NSIS installers not found" }
              Invoke-Checked -FilePath $baseline.FullName -ArgumentList @("/S") -Phase "baseline NSIS install"
              $daemonPath = Get-DaemonExecutable -Phase "baseline NSIS install"
              Invoke-Checked -FilePath $installer.FullName -ArgumentList @("/S") -Phase "NSIS upgrade"
              $daemonPath = Get-DaemonExecutable -Phase "NSIS upgrade"
              $uninstaller = Get-ChildItem (Split-Path $daemonPath) -Filter *uninstall*.exe | Select-Object -First 1
              if ($null -eq $uninstaller) { throw "NSIS uninstaller not found" }
              Invoke-Checked -FilePath $uninstaller.FullName -ArgumentList @("/S") -Phase "NSIS uninstall"
          }

          for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($null -eq (Get-Service OcteliumDaemon -ErrorAction SilentlyContinue)) {
                  break
              }
              Start-Sleep -Seconds 1
          }
          if ($null -ne (Get-Service OcteliumDaemon -ErrorAction SilentlyContinue)) {
              throw "The Octelium Desktop daemon service still exists after uninstall"
          }
          if (Test-Path -LiteralPath $daemonPath) {
              throw "The Octelium Desktop daemon executable still exists after uninstall"
          }
