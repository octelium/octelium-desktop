name: Release

permissions: {}

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      cli-tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_VERSION#v}"
          package="$(node -p 'require("./package.json").version')"
          tauri="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          cargo="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          [[ "$package" == "$expected" && "$tauri" == "$expected" && "$cargo" == "$expected" ]]
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          requested="$(gh release view --repo octelium/octelium --json tagName --jq .tagName)"
          echo "tag=$requested" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            bundle_config: src-tauri/tauri.bundle.conf.json
            bundles: deb,rpm,appimage
            upgrade_bundles: deb,rpm
            archive: tar.gz
            executable: octelium-desktop
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            bundle_config: src-tauri/tauri.bundle.conf.json
            bundles: deb,rpm,appimage
            upgrade_bundles: deb,rpm
            archive: tar.gz
            executable: octelium-desktop
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            target: x86_64-apple-darwin
            bundle_config: src-tauri/tauri.bundle.conf.json
            bundles: app,dmg
            upgrade_bundles: app
            archive: tar.gz
            executable: octelium-desktop
          - runner: macos-15
            os: darwin
            arch: arm64
            target: aarch64-apple-darwin
            bundle_config: src-tauri/tauri.bundle.conf.json
            bundles: app,dmg
            upgrade_bundles: app
            archive: tar.gz
            executable: octelium-desktop
          - runner: windows-latest
            os: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            bundle_config: src-tauri/tauri.windows.bundle.conf.json
            bundles: nsis,msi
            upgrade_bundles: nsis,msi
            archive: zip
            executable: octelium-desktop.exe
          - runner: windows-11-arm
            os: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            bundle_config: src-tauri/tauri.windows.bundle.conf.json
            bundles: nsis,msi
            upgrade_bundles: nsis,msi
            archive: zip
            executable: octelium-desktop.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf rpm
      - run: npm ci
      - name: Download Octelium CLI
        env:
          GH_TOKEN: ${{ github.token }}
          OCTELIUM_TAG: ${{ needs.validate.outputs.cli-tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir octelium-cli
          gh release download "$OCTELIUM_TAG" --repo octelium/octelium --dir octelium-cli --pattern "octelium-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}" --pattern "SHA256SUMS"
          cd octelium-cli
          archive="octelium-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}"
          checksum="SHA256SUMS"
          node -e 'const fs=require("fs"),c=require("crypto"),f=process.argv[1],s=process.argv[2],h=c.createHash("sha256").update(fs.readFileSync(f)).digest("hex"),line=fs.readFileSync(s,"utf8").split(/\r?\n/).find(v=>v.trim().endsWith("  "+f));if(!line||line.trim().split(/\s+/)[0]!==h)process.exit(1)' "$archive" "$checksum"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            unzip -q "$archive" -d extracted
          else
            mkdir extracted
            tar -xzf "$archive" -C extracted
          fi
          binary="octelium${{ matrix.os == 'windows' && '.exe' || '' }}"
          sidecar="../src-tauri/binaries/octelium-desktop-daemon-${{ matrix.target }}${{ matrix.os == 'windows' && '.exe' || '' }}"
          mkdir -p ../src-tauri/binaries
          cp "extracted/$binary" "$sidecar"
          chmod +x "$sidecar"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            cp extracted/wireguard.dll extracted/wintun.dll ../src-tauri/binaries/
          fi
          printf '%s\n' "$OCTELIUM_TAG" > VERSION
      - name: Build upgrade baseline
        shell: bash
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.upgrade_bundles }}" --config "${{ matrix.bundle_config }}" --config src-tauri/tauri.unsigned.conf.json --config '{"version":"0.0.1"}' --ignore-version-mismatches
      - name: Build macOS upgrade baseline
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          target="src-tauri/target/${{ matrix.target }}/release"
          src-tauri/installer/macos/build-pkg.sh \
            "$target/bundle/macos/Octelium Desktop.app" \
            "0.0.1" \
            "${{ matrix.arch }}" \
            "$target/bundle/pkg/Octelium_0.0.1_${{ matrix.arch }}.pkg"
      - name: Collect upgrade baseline
        shell: bash
        run: |
          set -euo pipefail
          target="src-tauri/target/${{ matrix.target }}/release"
          baseline="upgrade-baseline"
          mkdir "$baseline"
          while IFS= read -r -d '' file; do
            cp "$file" "$baseline/upgrade-baseline-$(basename "$file")"
          done < <(find "$target/bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.pkg' -o -name '*-setup.exe' \) -print0)
          rm -rf "$target/bundle"
      - name: Build application
        shell: bash
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config "${{ matrix.bundle_config }}" --config src-tauri/tauri.unsigned.conf.json
      - name: Build macOS installer package
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          target="src-tauri/target/${{ matrix.target }}/release"
          src-tauri/installer/macos/build-pkg.sh \
            "$target/bundle/macos/Octelium Desktop.app" \
            "$version" \
            "${{ matrix.arch }}" \
            "$target/bundle/pkg/Octelium_${version}_${{ matrix.arch }}.pkg"
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          output="release-output"
          target="src-tauri/target/${{ matrix.target }}/release"
          mkdir "$output"
          cp upgrade-baseline/* "$output/"
          cp "$target/${{ matrix.executable }}" "$output/octelium-desktop-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}"
          while IFS= read -r -d '' file; do
            cp "$file" "$output/octelium-desktop-${{ matrix.os }}-${{ matrix.arch }}-$(basename "$file")"
          done < <(find "$target/bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.pkg' -o -name '*-setup.exe' \) -print0)
          cp "octelium-cli/octelium-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}" "$output/"
          cp octelium-cli/VERSION "$output/OCTELIUM_CLI_VERSION-${{ matrix.os }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 1

  test-installers:
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/installer-test.yaml
    with:
      artifact_prefix: release

  publish:
    needs: [build, test-installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: artifacts
      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          find artifacts -type f ! -name 'upgrade-baseline-*' -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-files/SHA256SUMS
      - name: Add attestation
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: cp "$ATTESTATION_BUNDLE" release-files/release-attestation.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
