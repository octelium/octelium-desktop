[package]
name = "octelium-grpc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
bytes = "1"
http = "1"
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = [
  "channel",
  "codegen",
  "transport",
  "tls-ring",
  "tls-native-roots",
] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
